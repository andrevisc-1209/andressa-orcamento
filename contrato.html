<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Contrato · Andressa Pimentel Fotografia</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0d0c0b;--surface:#141210;--border:#2e2820;--gold:#c9a96e;--gold-d:#8a6e3e;--text:#e8ddd0;--muted:#7a6e62;--red:#c0614e}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Montserrat',sans-serif;font-weight:300;min-height:100vh}

/* NAV */
nav{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:52px;position:sticky;top:0;z-index:100}
.nav-logo{font-family:'Cormorant Garamond',serif;font-size:16px;letter-spacing:2px;color:var(--gold)}
.nav-links{display:flex;gap:4px}
.nav-link{padding:8px 16px;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);text-decoration:none;transition:color .2s}
.nav-link:hover{color:var(--text)}

/* MAIN */
main{max-width:860px;margin:0 auto;padding:32px 20px 80px}

/* SETUP CARD */
#setupCard{background:var(--surface);border:1px solid var(--border);padding:32px;margin-bottom:32px}
.setup-title{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:300;color:var(--gold);margin-bottom:6px;letter-spacing:1px}
.setup-sub{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:28px}
.field{margin-bottom:18px}
.field label{display:block;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.field input,.field select{width:100%;background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--text);font-family:'Montserrat',sans-serif;font-size:14px;padding:8px 0;outline:none;transition:border-color .2s}
.field input:focus,.field select:focus{border-bottom-color:var(--gold)}
.field input::placeholder{color:var(--muted)}
.field select option{background:#1a1815;color:var(--text)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px}
.hint{font-size:10px;color:var(--muted);margin-top:5px;letter-spacing:.5px}
.auth-row{display:flex;gap:24px;margin-top:8px}
.auth-opt{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;color:var(--muted)}
.auth-opt input[type=radio]{accent-color:var(--gold);width:16px;height:16px;cursor:pointer}
.auth-opt.selected{color:var(--text)}
.btn-gerar{margin-top:28px;width:100%;padding:14px;background:transparent;border:1px solid var(--gold);color:var(--gold);font-family:'Montserrat',sans-serif;font-size:10px;letter-spacing:4px;text-transform:uppercase;cursor:pointer;transition:all .3s}
.btn-gerar:hover{background:var(--gold);color:var(--bg)}
.err{font-size:11px;color:var(--red);margin-top:12px;display:none}

/* CONTRATO */
#contratoWrap{display:none}
.contrato-actions{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap}
.btn-print{padding:10px 24px;background:var(--gold);color:var(--bg);font-family:'Montserrat',sans-serif;font-size:10px;letter-spacing:3px;text-transform:uppercase;border:none;cursor:pointer;transition:opacity .2s}
.btn-print:hover{opacity:.85}
.btn-edit{padding:10px 24px;background:transparent;border:1px solid var(--border);color:var(--muted);font-family:'Montserrat',sans-serif;font-size:10px;letter-spacing:3px;text-transform:uppercase;cursor:pointer;transition:all .2s}
.btn-edit:hover{border-color:var(--gold);color:var(--gold)}

/* DOCUMENTO */
.doc{background:#fff;color:#1a1a1a;padding:56px 64px;font-family:'Montserrat',sans-serif;font-size:12.5px;line-height:1.75;box-shadow:0 4px 40px rgba(0,0,0,.5)}
.doc-header{text-align:center;margin-bottom:36px;border-bottom:2px solid #1a1a1a;padding-bottom:20px}
.doc-header h1{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}
.doc-header p{font-size:11px;color:#555;letter-spacing:1px}
.partes{background:#f8f8f6;padding:18px 22px;margin-bottom:28px;border-left:3px solid #c9a96e}
.partes p{margin-bottom:6px;font-size:12px}
.partes p:last-child{margin-bottom:0}
.partes strong{font-weight:500}
.clausula{margin-bottom:22px}
.clausula h2{font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;color:#1a1a1a}
.clausula p{margin-bottom:6px;color:#333}
.clausula ul{margin:8px 0 8px 20px;color:#333}
.clausula ul li{margin-bottom:4px}
.auth-check{display:flex;align-items:flex-start;gap:10px;margin:6px 0}
.auth-check span.box{display:inline-block;width:14px;height:14px;border:1.5px solid #333;flex-shrink:0;margin-top:2px;text-align:center;line-height:12px;font-size:11px}
.auth-check span.box.checked{background:#1a1a1a;color:#fff}
.assinatura-section{margin-top:48px;padding-top:24px;border-top:1px solid #ccc}
.assinatura-row{display:grid;grid-template-columns:1fr 1fr;gap:48px;margin-top:32px}
.assinatura-box{}
.assinatura-line{border-top:1px solid #333;margin-bottom:8px}
.assinatura-nome{font-size:11px;font-weight:500;letter-spacing:.5px}
.assinatura-sub{font-size:10px;color:#666;margin-top:2px}
.local-data{text-align:center;font-size:12px;margin-bottom:32px;color:#333}
.destaque{font-weight:500;background:#fff8e8;padding:1px 4px}

@media(max-width:600px){
  .doc{padding:32px 24px}
  .grid-2,.grid-3{grid-template-columns:1fr}
  .assinatura-row{grid-template-columns:1fr;gap:32px}
}

@media print{
  nav,#setupCard,.contrato-actions{display:none!important}
  #contratoWrap{display:block!important}
  body{background:#fff}
  .doc{box-shadow:none;padding:0}
  main{padding:0;max-width:100%}
}
</style>
</head>
<body>

<nav>
  <span class="nav-logo">Andressa Pimentel</span>
  <div class="nav-links">
    <a class="nav-link" href="index.html">Orçamento</a>
    <a class="nav-link" href="dashboard.html">Dashboard</a>
  </div>
</nav>

<main>

  <!-- FORMULÁRIO DE SETUP -->
  <div id="setupCard">
    <div class="setup-title">Gerar Contrato</div>
    <div class="setup-sub">Preencha ou confirme os dados para o contrato</div>

    <div class="grid-2">
      <div class="field">
        <label>Nome completo do cliente *</label>
        <input type="text" id="s_nome" placeholder="Nome da cliente"/>
      </div>
      <div class="field">
        <label>CPF do cliente *</label>
        <input type="text" id="s_cpf" placeholder="000.000.000-00" maxlength="14"/>
      </div>
    </div>

    <div class="grid-3">
      <div class="field">
        <label>Tipo de serviço *</label>
        <select id="s_servico">
          <option value="">Selecione</option>
          <option>Ensaio Gestante</option>
          <option>Acompanhamento</option>
          <option>Festa</option>
          <option>Batizado</option>
          <option>Festa Infantil</option>
          <option>Parto</option>
        </select>
      </div>
      <div class="field">
        <label>Data do evento *</label>
        <input type="date" id="s_data"/>
      </div>
      <div class="field">
        <label>Hora de início *</label>
        <input type="time" id="s_hora"/>
      </div>
    </div>

    <div class="grid-2">
      <div class="field">
        <label>Local do evento *</label>
        <input type="text" id="s_local" placeholder="Endereço completo"/>
      </div>
      <div class="field">
        <label>Horas de duração *</label>
        <input type="number" id="s_horas" placeholder="Ex: 2" min="0.5" max="12" step="0.5"/>
        <p class="hint">Entre 1 e 2 horas de acompanhamento padrão</p>
      </div>
    </div>

    <div class="field">
      <label>Valor total do serviço (R$) *</label>
      <input type="number" id="s_valor" placeholder="0.00" min="0" step="0.01"/>
    </div>

    <div class="field">
      <label>Uso de imagem pela fotógrafa</label>
      <div class="auth-row">
        <label class="auth-opt">
          <input type="radio" name="uso_imagem" id="r_autoriza" value="autoriza"/>
          Autorizar uso para portfólio e redes sociais
        </label>
        <label class="auth-opt">
          <input type="radio" name="uso_imagem" id="r_nao_autoriza" value="nao"/>
          Não autorizar
        </label>
      </div>
    </div>

    <div class="err" id="setupErr">Preencha todos os campos obrigatórios (*)</div>
    <button class="btn-gerar" onclick="gerarContrato()">Visualizar contrato</button>
  </div>

  <!-- CONTRATO GERADO -->
  <div id="contratoWrap">
    <div class="contrato-actions">
      <button class="btn-print" onclick="window.print()">⎙ Imprimir / Salvar PDF</button>
      <button class="btn-edit" onclick="voltarSetup()">← Editar dados</button>
    </div>
    <div class="doc" id="docContent">
      <!-- preenchido via JS -->
    </div>
  </div>

</main>

<script>
// Pré-preencher a partir de URL params (enviados pelo dashboard)
(function preencherParams() {
  const p = new URLSearchParams(window.location.search);
  const set = (id, val) => { if(val) document.getElementById(id).value = val; };
  set('s_nome',    p.get('nome'));
  set('s_cpf',     p.get('cpf'));
  set('s_local',   p.get('local'));
  set('s_data',    p.get('data'));
  set('s_hora',    p.get('hora'));
  set('s_horas',   p.get('horas'));
  set('s_valor',   p.get('valor'));
  // serviço (select)
  const svc = p.get('servico');
  if(svc) {
    const sel = document.getElementById('s_servico');
    for(let i=0;i<sel.options.length;i++){
      if(sel.options[i].text===svc){sel.selectedIndex=i;break;}
    }
  }
})();

function fmtData(val) {
  if(!val) return '____/____/________';
  const [y,m,d] = val.split('-');
  return `${d}/${m}/${y}`;
}
function fmtMoney(v) {
  return 'R$ ' + parseFloat(v).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function fmtHora(val) {
  if(!val) return '____h';
  const [h,m] = val.split(':');
  return m === '00' ? h+'h' : h+'h'+m;
}

function gerarContrato() {
  const nome   = document.getElementById('s_nome').value.trim();
  const cpf    = document.getElementById('s_cpf').value.trim();
  const svc    = document.getElementById('s_servico').value;
  const data   = document.getElementById('s_data').value;
  const hora   = document.getElementById('s_hora').value;
  const local  = document.getElementById('s_local').value.trim();
  const horas  = document.getElementById('s_horas').value;
  const valor  = document.getElementById('s_valor').value;
  const uso    = document.querySelector('input[name="uso_imagem"]:checked');
  const err    = document.getElementById('setupErr');

  if(!nome || !cpf || !svc || !data || !hora || !local || !horas || !valor) {
    err.style.display = 'block';
    return;
  }
  err.style.display = 'none';

  const v        = parseFloat(valor);
  const sinal    = v / 2;
  const horasNum = parseFloat(horas);
  const usoImg   = uso ? uso.value : null;
  const autoriza = usoImg === 'autoriza';
  const naoAut   = usoImg === 'nao';

  const hoje = new Date();
  const todayStr = `${String(hoje.getDate()).padStart(2,'0')}/${String(hoje.getMonth()+1).padStart(2,'0')}/${hoje.getFullYear()}`;

  document.getElementById('docContent').innerHTML = `
    <div class="doc-header">
      <h1>Contrato de Prestação de Serviços Fotográficos</h1>
      <p>Andressa Pimentel Fotografia &nbsp;·&nbsp; Rio de Janeiro/RJ</p>
    </div>

    <div class="partes">
      <p><strong>CONTRATADA:</strong> Andressa Cristina Pimentel Alves, CPF 130.446.207-24, fotógrafa.</p>
      <p><strong>CONTRATANTE:</strong> ${nome}, CPF ${cpf}.</p>
    </div>

    <div class="clausula">
      <h2>1. Objeto</h2>
      <p>O presente contrato tem como objeto a prestação de serviços fotográficos do tipo <span class="destaque">${svc}</span>, a ser realizado no dia <span class="destaque">${fmtData(data)}</span>, no local <span class="destaque">${local}</span>, com início às <span class="destaque">${fmtHora(hora)}</span>, com duração aproximada de <span class="destaque">${horasNum} hora${horasNum !== 1 ? 's' : ''}</span> de acompanhamento.</p>
    </div>

    <div class="clausula">
      <h2>2. Forma de Pagamento</h2>
      <p>O valor total do serviço é de <span class="destaque">${fmtMoney(v)}</span>.</p>
      <p>O pagamento será realizado via PIX (chave CPF: 130.446.207-24), da seguinte forma:</p>
      <ul>
        <li><strong>50% (${fmtMoney(sinal)})</strong> no ato da reserva (sinal);</li>
        <li><strong>50% (${fmtMoney(sinal)})</strong> no dia da realização do ensaio/evento.</li>
      </ul>
      <p>A data só será considerada reservada mediante pagamento do sinal.</p>
    </div>

    <div class="clausula">
      <h2>3. Entrega das Fotos</h2>
      <p>A CONTRATADA realizará a entrega de todas as fotos tratadas, em formato digital, através de galeria online. Serão entregues no mínimo 40 fotos e no máximo 120 fotos, podendo este número ser ultrapassado a critério da CONTRATADA, sem custo adicional.</p>
      <p>O prazo de entrega é de até <strong>15 dias úteis</strong> após a realização do serviço, podendo ser antecipado a critério da CONTRATADA. O link da galeria será enviado ao WhatsApp ou e-mail da CONTRATANTE, para acesso e download das imagens.</p>
      <p>A galeria ficará disponível por <strong>90 dias</strong>, sendo recomendado que a CONTRATANTE realize o download e armazenamento em dispositivo pessoal dentro deste prazo. A CONTRATADA poderá enviar prévias das fotos antes do prazo final, sem compromisso. Não estão inclusos álbuns impressos ou materiais físicos.</p>
    </div>

    <div class="clausula">
      <h2>4. Direitos Autorais e Uso de Imagem</h2>
      <p>A CONTRATANTE declara estar ciente e optar por:</p>
      <div class="auth-check"><span class="box${autoriza?' checked':''}"></span><span>AUTORIZAR o uso das imagens pela CONTRATADA para fins de divulgação profissional, incluindo portfólio, redes sociais e materiais promocionais.</span></div>
      <div class="auth-check"><span class="box${naoAut?' checked':''}"></span><span>NÃO AUTORIZAR o uso das imagens para divulgação.</span></div>
      <p style="margin-top:10px">A CONTRATANTE está autorizada a utilizar as imagens livremente em suas redes sociais para fins pessoais, sendo vedado o uso comercial sem autorização prévia da CONTRATADA. As fotografias não poderão ser editadas, alteradas ou utilizadas para fins comerciais pela CONTRATANTE sem autorização prévia da CONTRATADA.</p>
    </div>

    <div class="clausula">
      <h2>5. Cancelamento e Remarcação</h2>
      <p>Em caso de cancelamento por parte da CONTRATANTE, o valor pago como sinal não será reembolsado. Será permitida a remarcação do ensaio/evento nas seguintes situações:</p>
      <ul>
        <li>Doença, mediante apresentação de atestado médico;</li>
        <li>Condições climáticas desfavoráveis (em caso de ensaios externos).</li>
      </ul>
      <p>A CONTRATANTE deverá sugerir até 3 novas datas para remarcação. A nova data será definida de acordo com a disponibilidade da CONTRATADA. O prazo máximo para remarcação é de <strong>45 dias</strong> após a data originalmente agendada, não havendo possibilidade de reembolso após este período.</p>
    </div>

    <div class="clausula">
      <h2>6. Direito de Arrependimento</h2>
      <p>Nos termos do Código de Defesa do Consumidor, a CONTRATANTE poderá exercer o direito de arrependimento no prazo de até <strong>7 dias corridos</strong> após a contratação, quando realizada fora do estabelecimento comercial. Em caso de cancelamento dentro deste prazo, poderá haver retenção do valor pago a título de sinal, considerando a reserva de agenda e possíveis prejuízos à CONTRATADA.</p>
    </div>

    <div class="clausula">
      <h2>7. Atrasos</h2>
      <p>Será tolerado atraso de até <strong>20 minutos</strong> por parte da CONTRATANTE. Após esse período, o tempo de ensaio/cobertura poderá ser reduzido proporcionalmente, sem extensão do horário final ou compensação.</p>
    </div>

    <div class="clausula">
      <h2>8. Backup e Segurança das Imagens</h2>
      <p>A CONTRATADA se compromete a manter backup das imagens por um período de até <strong>90 dias após a entrega</strong>. Após esse prazo, não há garantia de armazenamento dos arquivos, sendo responsabilidade da CONTRATANTE realizar o download e armazenamento adequado das fotos.</p>
    </div>

    <div class="clausula">
      <h2>9. Padrão Artístico e Edição</h2>
      <p>A CONTRATANTE declara conhecer e concordar com o estilo fotográfico e de edição da CONTRATADA, não cabendo solicitação de alterações que descaracterizem o trabalho autoral.</p>
    </div>

    <div class="clausula">
      <h2>10. Seleção e Curadoria das Imagens</h2>
      <p>As imagens passam por processo de seleção e curadoria, sendo descartadas fotos com falhas técnicas, repetidas ou fora do padrão de qualidade da CONTRATADA.</p>
    </div>

    <div class="clausula">
      <h2>11. Registro de Momentos</h2>
      <p>A CONTRATADA não garante o registro de momentos ou pessoas específicas, sendo responsabilidade da CONTRATANTE sinalizar previamente ou durante o evento.</p>
    </div>

    <div class="clausula">
      <h2>12. Condições do Ambiente</h2>
      <p>A CONTRATADA não se responsabiliza por limitações técnicas decorrentes de iluminação inadequada, condições climáticas ou estrutura do local.</p>
    </div>

    <div class="clausula">
      <h2>13. Arquivos Brutos (RAW)</h2>
      <p>Os arquivos brutos (RAW) não serão disponibilizados ao cliente.</p>
    </div>

    <div class="clausula">
      <h2>14. Imprevistos e Substituição</h2>
      <p>Em caso de impossibilidade da CONTRATADA por motivo de força maior, esta poderá indicar outro profissional com padrão semelhante ou realizar o reembolso integral dos valores pagos.</p>
    </div>

    <div class="clausula">
      <h2>15. Responsabilidades</h2>
      <p>Em casos de fatores externos como clima, problemas técnicos ou situações imprevistas, ambas as partes buscarão a melhor solução em comum acordo.</p>
    </div>

    <div class="clausula">
      <h2>16. Assinatura Digital</h2>
      <p>As partes concordam que este contrato poderá ser assinado eletronicamente, inclusive por meio da plataforma Gov.br, sendo considerado válido e com a mesma força jurídica de uma assinatura física.</p>
    </div>

    <div class="clausula">
      <h2>17. Foro</h2>
      <p>Fica eleito o foro da comarca de Rio de Janeiro/RJ para dirimir quaisquer dúvidas oriundas deste contrato.</p>
    </div>

    <div class="clausula">
      <h2>18. Disposições Gerais</h2>
      <p>Este contrato passa a ter validade a partir do pagamento do sinal.</p>
    </div>

    <div class="local-data">Rio de Janeiro, ${todayStr}</div>

    <div class="assinatura-section">
      <div class="assinatura-row">
        <div class="assinatura-box">
          <div style="height:48px"></div>
          <div class="assinatura-line"></div>
          <div class="assinatura-nome">${nome}</div>
          <div class="assinatura-sub">CONTRATANTE · CPF ${cpf}</div>
        </div>
        <div class="assinatura-box">
          <div style="height:48px"></div>
          <div class="assinatura-line"></div>
          <div class="assinatura-nome">Andressa Cristina Pimentel Alves</div>
          <div class="assinatura-sub">CONTRATADA · CPF 130.446.207-24</div>
        </div>
      </div>
    </div>
  `;

  document.getElementById('setupCard').style.display = 'none';
  document.getElementById('contratoWrap').style.display = 'block';
  window.scrollTo(0, 0);
}

function voltarSetup() {
  document.getElementById('contratoWrap').style.display = 'none';
  document.getElementById('setupCard').style.display = 'block';
}
</script>
</body>
</html>
